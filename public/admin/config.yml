backend:
  name: github
  repo: GuardianWisp/Wisplink
  branch: main
  base_url: https://wisplink.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Проекты"
    folder: "content/projects"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "URL проекта (латиницей, без пробелов)", name: "slug", widget: "string", hint: "Например: novyi-proekt — станет адресом /work/novyi-proekt", required: false }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Категория", name: "category", widget: "string" }
      - { label: "Год", name: "year", widget: "string" }
      - { label: "Клиент", name: "client", widget: "string" }
      - { label: "Порядок (01, 02, 03…)", name: "index", widget: "string", hint: "Управляет сортировкой по всему сайту" }
      - { label: "Краткое описание", name: "summary", widget: "text" }
      - { label: "Софт", name: "software", widget: "list", required: false }
      - { label: "Теги / услуги", name: "services", widget: "list", required: false, hint: "Питает фильтр по тегам на главной" }
      - { label: "Пропорции карточки на главной", name: "aspect", widget: "select", options: ["portrait", "landscape", "square"] }
      - { label: "Обложка (список проектов)", name: "cover", widget: "image", required: false }
      - { label: "Hero-изображение", name: "hero", widget: "image", required: false }
      - label: "Рендеры (галерея)"
        name: "renders"
        widget: "list"
        required: false
        fields:
          - { label: "Изображение", name: "src", widget: "image" }
          - { label: "Размер в сетке", name: "size", widget: "select", options: ["sm", "md", "lg", "xl"], required: false }
          - { label: "Пропорции (опционально)", name: "aspect", widget: "select", options: ["portrait", "landscape", "square", "wide"], required: false }
      - label: "Процесс (галерея)"
        name: "process"
        widget: "list"
        required: false
        fields:
          - { label: "Изображение", name: "src", widget: "image" }
          - { label: "Размер в сетке", name: "size", widget: "select", options: ["sm", "md", "lg", "xl"], required: false }
          - { label: "Пропорции (опционально)", name: "aspect", widget: "select", options: ["portrait", "landscape", "square", "wide"], required: false }
      - { label: "Описание проекта", name: "body", widget: "markdown" }

  - name: "posts"
    label: "Журнал"
    folder: "content/posts"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "URL записи (латиницей, без пробелов)", name: "slug", widget: "string", hint: "Например: novyi-post — станет адресом /blog/novyi-post", required: false }
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Краткое описание", name: "excerpt", widget: "text" }
      - { label: "Теги", name: "tags", widget: "list", required: false, hint: "Питает фильтр по тегам в журнале" }
      - { label: "Текст записи", name: "body", widget: "markdown" }
